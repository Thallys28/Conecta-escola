<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Conecta Escola</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Conecta Escola</h1>
        <!-- Placeholder para Logo -->
        <!-- <img src="logo.png" alt="Logo Conecta Escola"> -->
    </header>

    <main class="login-container">
        <h2>Acesse sua Conta</h2>
        <form action="dashboard.html" method="get"> <!-- Simulação de login -->
            <div class="form-group">
                <label for="usuario">Usuário (Matrícula/Email):</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <p><a href="#">Esqueceu sua senha?</a></p>
    </main>

    <footer>
        <p>&copy; 2025 Escola Conecta. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
